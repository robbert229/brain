apiVersion: v1
kind: Namespace
metadata:
  name: brain
  labels:
    app.kubernetes.io/name: braind
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: braind-data
  namespace: brain
  labels:
    app.kubernetes.io/name: braind
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: braind-headless
  namespace: brain
  labels:
    app.kubernetes.io/name: braind
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: braind
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: braind
  namespace: brain
  labels:
    app.kubernetes.io/name: braind
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: braind
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: braind
  namespace: brain
  labels:
    app.kubernetes.io/name: braind
spec:
  serviceName: braind-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: braind
  template:
    metadata:
      labels:
        app.kubernetes.io/name: braind
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: braind
          image: ghcr.io/robbert229/braind:v0.1.0 # x-release-please-version
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BRAIND_LISTEN_ADDR
              value: 0.0.0.0:8080
            - name: BRAIND_DATA_PATH
              value: /data
            - name: BRAIND_VAULT_PATH
              value: /data/vault
            - name: BRAIND_GIT_DIR
              value: /data/git/vault.git
            - name: BRAIND_SYNC_ENABLED
              value: "false"
            - name: BRAIND_GIT_BACKUP_ENABLED
              value: "false"
            - name: OIDC_ENABLED
              value: "false"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: braind-data
