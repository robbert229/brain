apiVersion: v1
kind: Namespace
metadata:
  name: brain
  labels:
    app.kubernetes.io/name: braind
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: braind-data
  namespace: brain
  labels:
    app.kubernetes.io/name: braind
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: braind-headless
  namespace: brain
  labels:
    app.kubernetes.io/name: braind
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: braind
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: braind
  namespace: brain
  labels:
    app.kubernetes.io/name: braind
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: braind
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: braind
  namespace: brain
  labels:
    app.kubernetes.io/name: braind
spec:
  serviceName: braind-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: braind
  template:
    metadata:
      labels:
        app.kubernetes.io/name: braind
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: braind
          image: ghcr.io/robbert229/braind:v0.2.0 # x-release-please-version
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BRAIND_LISTEN_ADDR
              value: 0.0.0.0:8080
            - name: BRAIND_DATA_PATH
              value: /data
            - name: BRAIND_VAULT_PATH
              value: /data/vault
            - name: BRAIND_GIT_DIR
              value: /data/git/vault.git
            - name: BRAIND_SYNC_ENABLED
              value: "false"
            - name: BRAIND_GIT_BACKUP_ENABLED
              value: "false"
            # Canonical public origin. It builds the provider redirect URI and
            # the session cookie scope, so it must match how users reach this
            # daemon; anything else makes sign-in land on an unknown host.
            - name: BRAIND_EXTERNAL_URL
              value: https://brain.lab.johnrowley.co
            - name: OIDC_ENABLED
              value: "false"
            # Sign-in (spec 002). Set OIDC_ENABLED to "true" and uncomment once
            # one provider is configured. Create the secret out of band, e.g.
            #   kubectl -n brain create secret generic braind-oidc \
            #     --from-literal=client-secret='<secret>'
            # so the credential never lives in this file.
            # - name: OIDC_CONFIGURATION_URL
            #   value: https://issuer.example.com/.well-known/openid-configuration
            # - name: OIDC_CLIENT_ID
            #   value: braind
            # - name: OIDC_CLIENT_SECRET
            #   valueFrom:
            #     secretKeyRef:
            #       name: braind-oidc
            #       key: client-secret
            # Exact-match groups. A person in none of them is denied.
            # - name: OIDC_ADMIN_GROUP
            #   value: access-brain-admin
            # - name: OIDC_USER_GROUP
            #   value: access-brain-user
            # - name: OIDC_VIEWER_GROUP
            #   value: access-brain-viewer
            # Session lifetimes. Sessions live in memory, so a restart or
            # reschedule signs everyone out; OIDC_REAUTH_INTERVAL also bounds how
            # long a session may be trusted without a fresh provider round trip.
            # - name: BRAIND_SESSION_IDLE_TIMEOUT
            #   value: 1h
            # - name: BRAIND_SESSION_ABSOLUTE_LIFETIME
            #   value: 8h
            # - name: OIDC_REAUTH_INTERVAL
            #   value: 1h
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: braind-data
